name: Build OpenSSL for Android
env:
  DEFAULT_OPENSSL_BRANCH: 'openssl-3.5'
on:
  workflow_dispatch:
    inputs:
      openssl_branch:
        description: 'OpenSSL branch/tag to build'
        required: true
        default: "openssl-3.5"
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-openssl-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64]
        include:
          - arch: arm
            android_abi: armeabi-v7a
            openssl_target: android-arm
          - arch: arm64
            android_abi: arm64-v8a
            openssl_target: android-arm64
        build_type:
          - Release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl make curl llvm
      
      - name: Download NDK
        run: |
          mkdir -p ${ANDROID_HOME}/ndk
          cd ${ANDROID_HOME}/ndk
          curl -O https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/android-ndk-r28" >> $GITHUB_ENV
          ls -la ${ANDROID_HOME}/ndk/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin/
      
      - name: Clone OpenSSL
        run: |
          git clone https://github.com/openssl/openssl.git
          cd openssl
          BRANCH_TO_USE="${{ github.event.inputs.openssl_branch || env.DEFAULT_OPENSSL_BRANCH }}"
          echo "Checking out OpenSSL branch/tag: $BRANCH_TO_USE"
          git checkout $BRANCH_TO_USE
          echo "OPENSSL_BRANCH=$BRANCH_TO_USE" >> $GITHUB_ENV
      
      - name: Set up environment variables
        run: |
          echo "ANDROID_API=35" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$(pwd)/output/${{ matrix.android_abi }}" >> $GITHUB_ENV
          echo "PACKAGE_DIR=$(pwd)/build" >> $GITHUB_ENV
          echo "SNAPSHOT_TAG=daily-snapshot" >> $GITHUB_ENV
      
      - name: Configure OpenSSL for Android ${{ matrix.android_abi }}
        working-directory: openssl
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          COMMON_OPTS="no-acvp-tests no-afalgeng no-apps no-argon2 no-aria no-asan no-autoerrinit \
          no-bf no-blake2 no-brotli no-brotli-dynamic no-buildtest-c++ \
          no-camellia no-capieng no-cast no-chacha no-cmp no-cms no-comp no-crypto-mdebug no-ct no-demos \
          no-devcryptoeng no-docs no-dtls no-dtls1 no-dtls1-method no-dtls1_2-method \
          no-ecdh no-ecdsa no-ec2m no-egd no-engine no-err no-external-tests \
          no-filenames no-fips no-fips-securitychecks no-fuzz-afl no-fuzz-libfuzzer \
          no-gost no-h3demo no-hqinterop no-http no-idea no-jitter no-seed \
          no-ktls no-legacy no-md2 no-md4 no-mdc2 no-msan no-deprecated no-ocb no-padlockeng \
          no-poly1305 no-posix-io no-rmd160 no-scrypt no-sctp no-siphash no-siv no-sm2 no-sm2-precomp \
          no-sm3 no-sm4 no-srp no-srtp no-ssl no-ssl-trace no-ssl3-method \
          no-static-engine no-tests no-tfo no-tls-deprecated-ec no-tls1_1 \
          no-tls1_1-method no-trace no-ts no-ubsan no-ui-console no-unit-test \
          no-uplink no-weak-ssl-ciphers no-whirlpool no-winstore no-zlib \
          no-rc4 no-rc5 no-rfc3779 no-zlib-dynamic no-zstd no-zstd-dynamic"
          if [ "${{ matrix.arch }}" = "arm" ]; then
            OPTS="$COMMON_OPTS no-asm"
          else
            OPTS="$COMMON_OPTS"
          fi
          ./Configure ${{ matrix.openssl_target }} $OPTS \
            --prefix=${{ env.OUTPUT_DIR }} \
            --openssldir=${{ env.OUTPUT_DIR }} \
            --api=1.1.0
      
      - name: Build OpenSSL
        working-directory: openssl
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make -j$(nproc)
          make install
          
      - name: Package .so files
        run: |
          mkdir -p ${{ env.PACKAGE_DIR }}
          TEMP_DIR=$(mktemp -d)
          mkdir -p $TEMP_DIR/lib/${{ matrix.android_abi }}
          LIBSSL=$(find ${{ env.OUTPUT_DIR }} -name "libssl*.so" -type f)
          LIBCRYPTO=$(find ${{ env.OUTPUT_DIR }} -name "libcrypto*.so" -type f)
          llvm-strip --strip-all $LIBSSL
          llvm-strip --strip-all $LIBCRYPTO
          cp $LIBSSL $TEMP_DIR/lib/${{ matrix.android_abi }}/libssl_3.so
          cp $LIBCRYPTO $TEMP_DIR/lib/${{ matrix.android_abi }}/libcrypto_3.so
          mkdir -p $TEMP_DIR/include
          cp -r ${{ env.OUTPUT_DIR }}/include/* $TEMP_DIR/include/
          PACKAGE_NAME="openssl-android-${{ matrix.android_abi }}-${{ env.OPENSSL_BRANCH }}"
          cd $TEMP_DIR
          zip -r ${{ env.PACKAGE_DIR }}/$PACKAGE_NAME.zip .
          tar -czf ${{ env.PACKAGE_DIR }}/$PACKAGE_NAME.tar.gz .
          ls -la ${{ env.PACKAGE_DIR }}/
      
      - name: Publish Daily Snapshot Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          name: "OpenSSL for Android - Daily Build"
          body: |
            Automated daily build of OpenSSL ${{ env.OPENSSL_BRANCH }} for Android

            This build includes binaries for Android (armeabi-v7a, arm64-v8a)
            
            **Note:** This snapshot may be overwritten by newer daily builds.
          files: |
            ${{ env.PACKAGE_DIR }}/openssl-android-${{ matrix.android_abi }}-*.zip
          prerelease: true
          delete_after: "7d"
      
      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: "OpenSSL for Android ${{ env.OPENSSL_BRANCH }}"
          body: |
            Release build of OpenSSL ${{ env.OPENSSL_BRANCH }} for Android
          files: |
            ${{ env.PACKAGE_DIR }}/openssl-android-${{ matrix.android_abi }}-*.zip
