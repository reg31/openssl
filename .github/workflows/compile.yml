name: Build OpenSSL for Android
on:
  workflow_dispatch:  # Manual trigger
    inputs:
      openssl_branch:
        description: 'OpenSSL branch/tag to build'
        required: true
        default: 'openssl-3.5'
        type: string
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-openssl-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64]
        include:
          - arch: arm
            android_abi: armeabi-v7a
            openssl_target: android-arm
          - arch: arm64
            android_abi: arm64-v8a
            openssl_target: android-arm64
        build_type:
          - Release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl make curl
      
      - name: Download NDK
        run: |
          mkdir -p ${ANDROID_HOME}/ndk
          cd ${ANDROID_HOME}/ndk
          curl -O https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/android-ndk-r28" >> $GITHUB_ENV
          
          # Verify NDK installation
          ls -la ${ANDROID_HOME}/ndk/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin/
      
      - name: Clone OpenSSL
        run: |
          git clone https://github.com/openssl/openssl.git
          cd openssl
          # Use the branch specified in workflow_dispatch input or default to master
          BRANCH_TO_USE="${{ github.event.inputs.openssl_branch || 'master' }}"
          echo "Checking out OpenSSL branch/tag: $BRANCH_TO_USE"
          git checkout $BRANCH_TO_USE
          
          # Get OpenSSL version and save it
          echo "OPENSSL_BRANCH=$BRANCH_TO_USE" >> $GITHUB_ENV
      
      - name: Set up environment variables
        run: |
          echo "ANDROID_API=35" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$(pwd)/output/${{ matrix.android_abi }}" >> $GITHUB_ENV
          echo "PACKAGE_DIR=$(pwd)/build" >> $GITHUB_ENV
          echo "SNAPSHOT_TAG=daily-snapshot" >> $GITHUB_ENV
      
      - name: Configure OpenSSL for Android ${{ matrix.android_abi }}
        working-directory: openssl
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          
          # Set up NDK environment variables properly
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # Use a single, correct Configure command
          ./Configure ${{ matrix.openssl_target }} no-asm no-apps no-tests no-docs no-legacy \
            --prefix=${{ env.OUTPUT_DIR }} \
            --openssldir=${{ env.OUTPUT_DIR }}
      
      - name: Build OpenSSL
        working-directory: openssl
        run: |
          # Set up NDK environment variables properly
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          make -j$(nproc)
          make install
      
      - name: Package .so files
        run: |
          mkdir -p ${{ env.PACKAGE_DIR }}
          
          # Find all .so files in the output directory and create a zip file
          find ${{ env.OUTPUT_DIR }} -name "*.so" -type f -exec ls -la {} \;
          
          # Create a directory structure that matches what we want in the zip
          TEMP_DIR=$(mktemp -d)
          mkdir -p $TEMP_DIR/lib/${{ matrix.android_abi }}
          
          # Copy all .so files to the temp directory
          cp $(find ${{ env.OUTPUT_DIR }} -name "*.so" -type f) $TEMP_DIR/lib/${{ matrix.android_abi }}/
          
          # Also copy includes for a complete package
          mkdir -p $TEMP_DIR/include
          cp -r ${{ env.OUTPUT_DIR }}/include/* $TEMP_DIR/include/
          
          # Create zip file
          PACKAGE_NAME="openssl-android-${{ matrix.android_abi }}-${{ env.OPENSSL_VERSION }}"
          cd $TEMP_DIR
          zip -r ${{ env.PACKAGE_DIR }}/$PACKAGE_NAME.zip .
          
          # Also create a tar.gz file as an alternative
          tar -czf ${{ env.PACKAGE_DIR }}/$PACKAGE_NAME.tar.gz .
          
          # List the created packages
          ls -la ${{ env.PACKAGE_DIR }}/
      
      - name: Delete existing snapshot tag
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && matrix.arch == 'arm64' }}
        run: |
          # Delete the existing tag locally and remotely
          git fetch --tags
          if git rev-parse --verify ${{ env.SNAPSHOT_TAG }} &>/dev/null; then
            git tag -d ${{ env.SNAPSHOT_TAG }}
            git push origin :refs/tags/${{ env.SNAPSHOT_TAG }} || echo "Tag didn't exist remotely"
          fi
      
      - name: Delete existing snapshot release
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && matrix.arch == 'arm64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing release with this tag if it exists
          release_id=$(gh release view ${{ env.SNAPSHOT_TAG }} --json id -q .id 2>/dev/null || echo "")
          if [ ! -z "$release_id" ]; then
            echo "Deleting existing release with ID: $release_id"
            gh release delete ${{ env.SNAPSHOT_TAG }} --cleanup-tag --yes
          else
            echo "No existing release found to delete"
          fi
      
      - name: Create new snapshot tag
        if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule') && matrix.arch == 'arm64' }}
        run: |
          # Create a new tag
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -f ${{ env.SNAPSHOT_TAG }}
          git push origin ${{ env.SNAPSHOT_TAG }} -f
      
      - name: Publish Daily Snapshot Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
        with:
          tag_name: ${{ env.SNAPSHOT_TAG }}
          name: "OpenSSL for Android - Daily Build"
          body: |
            Automated daily build of OpenSSL ${{ env.OPENSSL_VERSION }} for Android
            Built on: ${{ github.event.repository.updated_at || github.run_id }}
            Architecture: ${{ matrix.android_abi }}
          files: |
            ${{ env.PACKAGE_DIR }}/openssl-android-${{ matrix.android_abi }}-*.zip
            ${{ env.PACKAGE_DIR }}/openssl-android-${{ matrix.android_abi }}-*.tar.gz
          prerelease: true
      
      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          name: "OpenSSL for Android ${{ env.OPENSSL_VERSION }}"
          body: |
            Release build of OpenSSL ${{ env.OPENSSL_VERSION }} for Android
            Architecture: ${{ matrix.android_abi }}
          files: |
            ${{ env.PACKAGE_DIR }}/openssl-android-${{ matrix.android_abi }}-*.zip
            ${{ env.PACKAGE_DIR }}/openssl-android-${{ matrix.android_abi }}-*.tar.gz
