name: Build OpenSSL for Android
on:
  workflow_dispatch:  # Manual trigger
    inputs:
      openssl_branch:
        description: 'OpenSSL branch/tag to build'
        required: true
        default: 'openssl-3.5'
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-openssl-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64]
        include:
          - arch: arm
            android_abi: armeabi-v7a
            openssl_target: android-arm
          - arch: arm64
            android_abi: arm64-v8a
            openssl_target: android-arm64
        build_type:
          - Release
        package_generator:
          - TBZ2
          - ZIP
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'  # Using a more established Java version
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl make curl cmake
      
      - name: Download NDK
        run: |
          mkdir -p ${ANDROID_HOME}/ndk
          cd ${ANDROID_HOME}/ndk
          curl -O https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/android-ndk-r28" >> $GITHUB_ENV
          
          # Verify NDK installation
          ls -la ${ANDROID_HOME}/ndk/android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64/bin/
      
      - name: Clone OpenSSL
        run: |
          git clone https://github.com/openssl/openssl.git
          cd openssl
          # Use the branch specified in workflow_dispatch input or default to master
          BRANCH_TO_USE="${{ github.event.inputs.openssl_branch || 'master' }}"
          echo "Checking out OpenSSL branch/tag: $BRANCH_TO_USE"
          git checkout $BRANCH_TO_USE
      
      - name: Set up environment variables
        run: |
          echo "ANDROID_API=35" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$(pwd)/output/${{ matrix.android_abi }}" >> $GITHUB_ENV
      
      - name: Configure OpenSSL for Android ${{ matrix.android_abi }}
        working-directory: openssl
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          
          # Set up NDK environment variables properly
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          # Print debug info to verify paths
          echo "PATH: $PATH"
          ls -la $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/
          
          # Use a single, correct Configure command
          ./Configure ${{ matrix.openssl_target }} no-asm no-apps no-tests no-docs \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix=${{ env.OUTPUT_DIR }} \
            --openssldir=${{ env.OUTPUT_DIR }}
      
      - name: Build OpenSSL
        working-directory: openssl
        run: |
          # Set up NDK environment variables properly
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          make -j$(nproc)
          make install
      
      - name: Package OpenSSL
        if: matrix.package_generator != ''
        run: |
          mkdir -p build
          cd build
          
          # Create a simple CMakeLists.txt to use CPack
          echo "cmake_minimum_required(VERSION 3.10)" > CMakeLists.txt
          echo "project(OpenSSL)" >> CMakeLists.txt
          echo "set(CPACK_PACKAGE_NAME \"openssl-android-${{ matrix.android_abi }}\")" >> CMakeLists.txt
          echo "set(CPACK_GENERATOR \"${{ matrix.package_generator }}\")" >> CMakeLists.txt
          echo "set(CPACK_SOURCE_GENERATOR \"${{ matrix.package_generator }}\")" >> CMakeLists.txt
          echo "include(CPack)" >> CMakeLists.txt
          
          # Copy OpenSSL files to package
          mkdir -p openssl
          cp -r ${{ env.OUTPUT_DIR }}/* openssl/
          
          # Generate the package
          cmake .
          cpack -C ${{ matrix.build_type }}
      
      - name: Publish Snapshot Release
        uses: softprops/action-gh-release@v2
        if: ${{ (github.ref == 'refs/heads/main') && matrix.package_generator != '' }}
        with:
          tag_name: "snapshot-${{ github.sha }}"
          files: |
            build/openssl-android-${{ matrix.android_abi }}-*.*
      
      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.package_generator != '' }}
        with:
          files: |
            build/openssl-android-${{ matrix.android_abi }}-*.*
