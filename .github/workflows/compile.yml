name: Build OpenSSL for Android

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-openssl-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64]
        include:
          - arch: arm
            android_abi: armeabi-v7a
            openssl_target: android-arm
          - arch: arm64
            android_abi: arm64-v8a
            openssl_target: android-arm64
        build_type:
          - Release
        package_generator:
          - TBZ2
          - ZIP
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl make curl
      
      - name: Download NDK
        run: |
          mkdir -p ${ANDROID_HOME}/ndk
          cd ${ANDROID_HOME}/ndk
          curl -O https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/android-ndk-r28" >> $GITHUB_ENV
      
      - name: Clone OpenSSL
        run: |
          git clone https://github.com/openssl/openssl.git
          cd openssl
          git checkout master
      
      - name: Set up environment variables
        run: |
          echo "ANDROID_API=35" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$(pwd)/output/${{ matrix.android_abi }}" >> $GITHUB_ENV
      
      - name: Configure OpenSSL for Android ${{ matrix.android_abi }} with no-asm
        working-directory: openssl
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          
          # Add Android NDK to PATH	  
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          
          if [ "${{ matrix.arch }}" = "arm" ]; then
          ./Configure android-arm -D__ANDROID_API__=${{ env.ANDROID_API }} \
          no-asm \
          --prefix=${{ env.OUTPUT_DIR }} \
          --openssldir=${{ env.OUTPUT_DIR }}
          else
          ./Configure android-arm64 -D__ANDROID_API__=${{ env.ANDROID_API }} \
          no-asm \
          --prefix=${{ env.OUTPUT_DIR }} \
          --openssldir=${{ env.OUTPUT_DIR }}
          fi
          
          ./Configure ${{ matrix.openssl_target }} no-asm no-apps no-tests no-docs \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix=${{ env.OUTPUT_DIR }} \
            --openssldir=${{ env.OUTPUT_DIR }}
      
      - name: Build OpenSSL
        working-directory: openssl
        run: |
          make -j$(nproc)
          make install 

      - name: CPack
        if: matrix.package_generator != ''
        working-directory: ./build
        run: |
          cpack -C ${{matrix.build_type}} -G ${{matrix.package_generator}}

      - name: Publish Snapshot Release
        uses: softprops/action-gh-release@v1
        if: ${{ (github.ref == 'refs/heads/main') && matrix.package_generator != '' }}
        with:
          tag_name: "snapshot-${{ github.sha }}"
          files: |
            build/*-*${{ matrix.build_type }}*-*.*

      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.package_generator != '' }}
        with:
          files: |
            build/*-*${{ matrix.build_type }}*-*.*
