name: Build OpenSSL for Android

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-openssl-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64]
        include:
          - arch: arm
            android_abi: armeabi-v7a
            openssl_target: android-arm
          - arch: arm64
            android_abi: arm64-v8a
            openssl_target: android-arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl make curl
      
      - name: Download NDK
        run: |
          mkdir -p ${ANDROID_HOME}/ndk
          cd ${ANDROID_HOME}/ndk
          curl -O https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/android-ndk-r28" >> $GITHUB_ENV
      
      - name: Clone OpenSSL
        run: |
          git clone https://github.com/openssl/openssl.git
          cd openssl
          git checkout master
      
      - name: Set up environment variables
        run: |
          echo "ANDROID_API=35" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$(pwd)/output/${{ matrix.android_abi }}" >> $GITHUB_ENV
      
		- name: Configure OpenSSL for Android ${{ matrix.android_abi }} with no-asm
		  working-directory: openssl
		  run: |
			# Make sure to use the full path to the Clang compiler
			export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
			export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
			
			# Use the ANDROID_NDK_HOME directly in the Configure command
			if [ "${{ matrix.arch }}" = "arm" ]; then
			  ./Configure android-arm -D__ANDROID_API__=${{ env.ANDROID_API }} \
				no-asm \
				--prefix=${{ env.OUTPUT_DIR }} \
				--openssldir=${{ env.OUTPUT_DIR }}
			else
			  ./Configure android-arm64 -D__ANDROID_API__=${{ env.ANDROID_API }} \
				no-asm \
				--prefix=${{ env.OUTPUT_DIR }} \
				--openssldir=${{ env.OUTPUT_DIR }}
			fi
          
          ./Configure ${{ matrix.openssl_target }} no-asm \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix=${{ env.OUTPUT_DIR }} \
            --openssldir=${{ env.OUTPUT_DIR }}
      
      - name: Build OpenSSL
        working-directory: openssl
        run: |
          make -j$(nproc)
          make install_sw
      
      - name: Package OpenSSL binaries
        run: |
          mkdir -p artifacts
          tar -czvf artifacts/openssl-android-${{ matrix.android_abi }}-no-asm.tar.gz -C output ${{ matrix.android_abi }}
      
      - name: Upload OpenSSL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openssl-android-${{ matrix.android_abi }}-no-asm
          path: artifacts/openssl-android-${{ matrix.android_abi }}-no-asm.tar.gz
          retention-days: 7
